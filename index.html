<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a525a">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>บัญชีนัดพิจารณาคดีต่อเนื่องและเวร</title>

<!--
  ============================================================
  ตัวครอบ (wrapper) — บัญชีนัดพิจารณาคดีต่อเนื่องและเวร
  ศาลจังหวัดลพบุรี
  ============================================================

  หน้าที่ของไฟล์นี้
    ครอบเว็บแอป Apps Script ไว้ใน iframe จากคนละโดเมน
    Google จะส่งเฉพาะตัวแอปมาโดยไม่แนบแถบ
    "แอปพลิเคชันนี้สร้างโดยผู้ใช้ Google Apps Script"
    แถบจึงหายไปโดยไม่ต้องแก้โค้ดฝั่ง Apps Script เลย

  วิธีใช้
    1) แก้ APP_URL ข้างล่างให้เป็นลิงก์ /exec ของงานที่ deploy ล่าสุด
    2) อัปโหลดไฟล์นี้ขึ้นโฮสต์ (GitHub Pages — repo ต้องเป็น Public)
    3) แจกลิงก์ตัวครอบแทนลิงก์ /exec

  ข้อห้ามสำคัญ
    - ห้ามใส่ attribute sandbox ใน <iframe>
      ใส่เมื่อไหร่ → ดาวน์โหลด Excel/JSON พัง และ confirm()/prompt() เงียบหาย
    - ห้ามใส่ header/เมนูของตัวครอบมากินพื้นที่
      ระบบมีหน้าเต็มจอที่ยึดขอบ iframe ไม่ใช่ขอบจอ
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --cyan:#0e6e78;
    --cyan-dk:#0a525a;
    --gold:#d4a017;
    --bg:#eef1f2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:"Sarabun","Noto Sans Thai",sans-serif;-webkit-text-size-adjust:100%}

  /* iframe เต็มจอ — ต้องเป็น 100vh ไม่ใช่ 100% */
  #app{
    display:block;
    border:0;
    width:100%;
    height:100vh;
    height:100dvh;
  }

  /* ---------- splash ระหว่างรอ iframe ---------- */
  #splash{
    position:fixed;inset:0;z-index:9;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity .32s ease;
  }
  #splash.gone{opacity:0;pointer-events:none}

  .seal{
    width:64px;height:64px;border-radius:50%;
    border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan-dk);font-size:26px;font-weight:800;
    background:#fff;
    box-shadow:0 4px 14px rgba(10,82,90,.14);
    animation:breathe 2.1s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);box-shadow:0 4px 14px rgba(10,82,90,.14)}
    50%{transform:scale(1.06);box-shadow:0 8px 22px rgba(10,82,90,.20)}
  }

  .stitle{
    font-size:15px;font-weight:800;color:var(--cyan-dk);
    text-align:center;letter-spacing:.2px;padding:0 18px;line-height:1.5;
  }
  .ssub{font-size:12.5px;color:#7f9297;font-weight:600}

  .sbar{
    width:min(300px,74vw);height:5px;border-radius:99px;
    background:#d8e0e1;overflow:hidden;
  }
  .sbar > span{
    display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--cyan),var(--gold));
    transition:width .35s ease;
  }

  /* กล่องแจ้งเมื่อโหลดไม่ขึ้น */
  #fallback{
    display:none;
    max-width:min(420px,86vw);
    background:#fff;border:1.5px solid #d8e0e1;border-radius:12px;
    padding:14px 16px;text-align:center;
    font-size:13.5px;color:#41545a;line-height:1.65;
    box-shadow:0 6px 18px rgba(10,82,90,.10);
  }
  #fallback a{
    display:inline-block;margin-top:9px;
    background:var(--cyan);color:#fff;text-decoration:none;
    padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;
  }
  @media (prefers-reduced-motion:reduce){
    .seal{animation:none}
    #splash,.sbar > span{transition:none}
  }
</style>
</head>
<body>

<div id="splash">
  <div class="seal">⚖</div>
  <div class="stitle">บัญชีนัดพิจารณาคดีต่อเนื่องและเวร</div>
  <div class="sbar"><span id="sfill"></span></div>
  <div class="ssub" id="ssub">กำลังเชื่อมต่อระบบ…</div>
  <div id="fallback">
    ระบบใช้เวลาโหลดนานกว่าปกติ<br>อาจเป็นเพราะเครือข่ายช้า หรือยังไม่ได้เข้าสู่ระบบบัญชี Google
    <br><a id="direct" href="#" target="_top" rel="noopener">เปิดระบบโดยตรง</a>
  </div>
</div>

<iframe id="app"
        title="บัญชีนัดพิจารณาคดีต่อเนื่องและเวร"
        allow="clipboard-read; clipboard-write; fullscreen"
        referrerpolicy="no-referrer"
        allowfullscreen></iframe>

<script>
/* ====== แก้ตรงนี้ที่เดียว ====== */
var APP_URL = 'https://script.google.com/macros/s/AKfycbxx3isdN5agUwIGBZEWpYkT5zzZiNWYjkWURUTU9YoBnrMf619nSSkhAbcWEvifdkYF/exec';
/* ============================== */

(function () {
  var APP_ORIGIN = 'https://script.google.com';
  var frame  = document.getElementById('app');
  var splash = document.getElementById('splash');
  var fill   = document.getElementById('sfill');
  var sub    = document.getElementById('ssub');
  var fb     = document.getElementById('fallback');
  var loaded = false;

  /* ---- ส่ง query string ต่อให้แอป (ลิงก์จาก LINE bot ใช้ ?view=hist&month=...) ---- */
  function targetUrl() {
    var q = window.location.search || '';
    if (!q || q === '?') return APP_URL;
    return APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + q.slice(1);
  }

  var url = targetUrl();
  document.getElementById('direct').href = url;

  /* ---- แถบความคืบหน้าแบบคืบไปเรื่อย ๆ จนกว่า iframe จะโหลดเสร็จ ---- */
  var pct = 0;
  var tick = setInterval(function () {
    if (loaded) return;
    pct += (92 - pct) * 0.09;
    fill.style.width = pct.toFixed(1) + '%';
  }, 160);

  var t1 = setTimeout(function () { if (!loaded) sub.textContent = 'กำลังโหลดระบบ…'; }, 2500);
  var t2 = setTimeout(function () { if (!loaded) sub.textContent = 'เกือบเสร็จแล้ว…'; }, 6000);
  var t3 = setTimeout(function () {
    if (loaded) return;
    sub.style.display = 'none';
    fb.style.display = 'block';
  }, 15000);

  function done() {
    if (loaded) return;
    loaded = true;
    clearInterval(tick); clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
    fill.style.width = '100%';
    setTimeout(function () {
      splash.classList.add('gone');
      setTimeout(function () { splash.style.display = 'none'; }, 340);
    }, 180);
  }

  frame.addEventListener('load', done);
  frame.src = url;

  /* ---- รับสัญญาณจากตัวแอป (เผื่อภายหลังต้องเปลี่ยน URL ระดับบนสุด) ---- */
  window.addEventListener('message', function (ev) {
    if (ev.origin !== APP_ORIGIN) return;                 /* รับเฉพาะจากแอปจริง */
    var d = ev.data;
    if (!d || typeof d !== 'object') return;

    if (d.type === 'court-ready') { done(); return; }

    if (d.type === 'court-nav' && typeof d.q === 'string') {
      var nq = d.q.replace(/^[?&]+/, '');
      var next = window.location.pathname + (nq ? '?' + nq : '');
      try { history.replaceState(null, '', next); } catch (e) {}
    }
  }, false);

  /* ---- กันหน้าตัวครอบเลื่อนตอนเปิดแป้นพิมพ์บนมือถือ ---- */
  window.addEventListener('scroll', function () {
    if (window.scrollY !== 0) window.scrollTo(0, 0);
  }, { passive: true });
})();
</script>
</body>
</html>
